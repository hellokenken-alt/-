<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🐾🐱 狸と猫・活動集計（全リセット修正版）</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#111827; --muted:#667085;
  --line:#d9dee7; --head:#151a20; --blue:#087fe5; --red:#e53935;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body.dark{--bg:#101419;--card:#171c22;--text:#f4f7fb;--muted:#aab3bf;--line:#303944;--head:#0b0f13}
.wrap{max-width:980px;margin:auto;padding:5px 3px 70px}
h1{font-size:19px;margin:1px 0}
.note{font-size:9px;color:var(--muted);margin-bottom:4px}
.toolbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
button,select,input{font:inherit}
button,select,input[type=text]{
  border:1px solid #d4dae3;border-radius:12px;background:var(--card);color:var(--text)
}
button{padding:6px 7px;cursor:pointer;font-size:10px}
.primary{color:var(--blue);font-weight:700}
.danger{color:var(--red)}
#sort{padding:6px 20px 6px 6px;font-size:10px}
#addBox{display:none;gap:6px;width:100%;margin:0 0 8px}
#addBox input{flex:1;padding:10px}
.summary{
  background:var(--card);border:1px solid var(--line);border-radius:7px;
  padding:5px 7px;margin-bottom:5px;font-size:11px
}
.table-wrap{overflow:auto;border:1px solid var(--line);background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:0;table-layout:fixed}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
th{position:sticky;top:0;z-index:4;background:var(--head);color:white;height:32px;font-size:11px}
th.name,td.name{width:35%}
th.metric,td.metric{width:13%}
th.part,td.part{width:13%}
td{height:34px;background:var(--card)}
td.name{padding:2px 3px;font-weight:700;vertical-align:middle}
.name-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name-actions{display:flex;gap:2px;margin-top:0}
.name-actions button{font-size:7px;padding:0 3px;border-radius:5px;color:var(--blue);background:#edf5ff;border:0}
.name-actions .remove{color:var(--red);background:#fff0f0}
body.dark .name-actions button{background:#16283b}
body.dark .name-actions .remove{background:#32191b}
td.metric,td.part{text-align:center}
.ctrl{display:flex;justify-content:center;align-items:center;gap:1px}
.ctrl button{
  width:20px;height:22px;padding:0;border:0;border-radius:6px;
  background:#edf0f3;color:var(--blue);font-size:17px;line-height:1
}
body.dark .ctrl button{background:#202832}
.num{min-width:11px;font-size:12px;font-variant-numeric:tabular-nums}
.part .ctrl button{font-size:18px}

/* 5ごとの色変化。50超も継続 */
.v5{background:#fff4cc}
.v10{background:#dff7df}
.v15{background:#dff0ff}
.v20{background:#f0ddff}
.v25{background:#ffe0e0}
.v30{background:#d9fff7}
.v35{background:#fff0d8}
.v40{background:#e0e5ff}
.v45{background:#ffe2f2}
.v50{background:#d9f5ff}
.v55{background:#e5ffd9}
.v60{background:#fff1bf}
.v65{background:#e3dcff}
.v70{background:#ffdede}
.v75{background:#d5fff4}
.v80{background:#ffe6c7}
.v85{background:#dce8ff}
.v90{background:#ffdff1}
.v95{background:#d8ffdf}
.v100{background:#ffedb5}
body.dark td.metric.v5,body.dark td.part.v5{background:#5b4c16}
body.dark td.metric.v10,body.dark td.part.v10{background:#174b29}
body.dark td.metric.v15,body.dark td.part.v15{background:#173e60}
body.dark td.metric.v20,body.dark td.part.v20{background:#43255b}
body.dark td.metric.v25,body.dark td.part.v25{background:#5a2428}
body.dark td.metric.v30,body.dark td.part.v30{background:#155047}
body.dark td.metric.v35,body.dark td.part.v35{background:#59401f}
body.dark td.metric.v40,body.dark td.part.v40{background:#293667}
body.dark td.metric.v45,body.dark td.part.v45{background:#59263f}
body.dark td.metric.v50,body.dark td.part.v50{background:#16475a}
@media(max-width:700px){
  .wrap{padding-left:4px;padding-right:4px}
  h1{font-size:22px}
  table{min-width:0}
  th.name,td.name{width:35%}
  th.metric,td.metric{width:13%}
  th.part,td.part{width:13%}
  th{height:29px;font-size:10px}
  td{height:32px}
  td.name{padding:2px 3px}
  .name-text{font-size:9px}
  .name-actions{gap:2px}
  .name-actions button{font-size:7px;padding:1px 2px}
  .ctrl{gap:1px}
  .ctrl button{width:19px;height:21px;font-size:16px}
  .num{font-size:11px;min-width:9px}
}
</style>

<style id="log-modal-style">
.log-modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:99}
.log-panel{width:min(520px,94vw);max-height:70vh;overflow:auto;background:var(--card);color:var(--text);border-radius:18px 18px 0 0;padding:14px 14px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.log-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px}
.log-close{border:0;background:#edf0f3;color:#333;border-radius:10px;padding:6px 10px;font-size:12px}
body.dark .log-close{background:#252c34;color:#fff}
.log-item{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;background:var(--card)}
.log-item .log-name{font-weight:800;font-size:14px}
.log-item .log-meta{font-size:12px;color:var(--muted);margin-top:3px}
.log-empty{text-align:center;color:var(--muted);padding:20px 5px}
</style>

<style>
.today-count{display:flex;align-items:center;gap:8px;margin:6px 0;padding:6px 10px;border:1px solid #26313a;border-radius:10px;box-sizing:border-box}
.today-count button{border:0;border-radius:8px;padding:3px 10px;font-size:18px;line-height:1.1;cursor:pointer}
.today-count strong{font-size:14px}
.today-range{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐾 🐱 狸と猫・活動集計</h1>
  <div class="note">＋/−で増減。参加は1人につき1日1回。4:00〜翌3:59の間に活動すると参加が+1され、同じ日は増えません。個人の参加累計はリセットされません。</div>

  <div class="toolbar">
    <select id="sort">
      <option value="name">名前順</option>
      <option value="募集-desc">募集 多い順</option><option value="募集-asc">募集 少ない順</option>
      <option value="リーグ-desc">リーグ 多い順</option><option value="リーグ-asc">リーグ 少ない順</option>
      <option value="トロ-desc">トロ 多い順</option><option value="トロ-asc">トロ 少ない順</option>
      <option value="腕スタ-desc">腕スタ 多い順</option><option value="腕スタ-asc">腕スタ 少ない順</option>
      <option value="参加-desc">参加 多い順</option><option value="参加-asc">参加 少ない順</option>
    </select>
    <button class="primary" id="addBtn">＋メンバー追加</button>
    <button class="primary" id="resetBtn">全リセット</button>
    <button id="darkBtn">☀/🌙</button>
    <button id="logBtn">📋 増加記録</button>
  </div>

  <div id="addBox">
    <input id="newName" type="text" placeholder="メンバー名を入力">
    <button class="primary" id="doAdd">追加</button>
    <button id="cancelAdd">キャンセル</button>
  </div>

  <div class="summary">
    <b>今日の参加人数：<span id="todayCount">0</span>人</b>
    <span style="color:var(--muted)">　（4:00〜翌3:59）</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th class="name">名前</th>
        <th class="metric">募集</th><th class="metric">リーグ</th><th class="metric">トロ</th><th class="metric">腕スタ</th>
        <th class="part">参加</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<div class="log-modal" id="logModal">
  <div class="log-panel">
    <div class="log-title"><span>📋 増加記録・最新5件</span><button class="log-close" id="logClose">閉じる</button></div>
    <div id="logList"></div>
  </div>
</div>


<script>
const KEY="tanuki_neko_activity_v7";
const membersDefault=[
"aba","DODダディ","DR7","LATTE","NAO","Nob55","Pスケ","Ronho","ruru","あも","かつ","キィ〜","けんけん","こき見賢","コレルア","しのあ","しゅー①","ちろさん","ないん","にょきち","ねこ","のび太","ピース","ピョニー","ボーちゃん","みい","ミケユリX","みたま","むらびと","メンチカツ","よいでないか","レクイエム","薫","釈迦釈迦チキン","松居","神様","茶々丸","猫","博奕うんべぇ","夜ト"
];
const activities=["募集","リーグ","トロ","腕スタ"];

function periodKey(){
  const d=new Date();
  if(d.getHours()<4)d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}

function ensureDailyPeriod(){
  const p=periodKey();
  if(state.dailyPeriod!==p){
    state.dailyPeriod=p;
    state.todayParticipants=0;
  }
  if(typeof state.todayParticipants!=="number") state.todayParticipants=0;
}

function changeTodayParticipants(delta){
  ensureDailyPeriod();
  state.todayParticipants=Math.max(0,(+state.todayParticipants||0)+delta);
  save();
  render();
}

function blankMember(name){
  return {
    id:crypto.randomUUID(),name,
    vals:{募集:0,リーグ:0,トロ:0,腕スタ:0,参加:0},
    daily:{period:periodKey(),delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}},
    baseToday:0
  };
}
function load(){
  let s=localStorage.getItem(KEY);
  if(s){try{return JSON.parse(s)}catch(e){}}
  return {members:membersDefault.map(blankMember), logs:[], dark:false};
}
let state=load();

function normalize(){
  const p=periodKey();
  for(const m of state.members){
    if(!m.daily || m.daily.period!==p){
      m.daily={period:p,delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
      m.baseToday=m.vals.参加;
    }else if(!m.daily.acts){
      m.daily.acts={募集:0,リーグ:0,トロ:0,腕スタ:0};
    }
  }
  save();
}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function shade(v){
  if(v<=0)return "";
  return "v"+(Math.min(100,Math.floor(v/5)*5));
}
function todayActive(m){return (m.daily?.delta||0)>0}

function render(){
  ensureDailyPeriod();
  const tp=document.getElementById("todayParticipantsValue"); if(tp) tp.textContent=state.todayParticipants||0;


  normalize();
  let arr=[...state.members];
  const s=document.getElementById("sort").value;
  if(s!=="name"){
    const [k,dir]=s.split("-");
    arr.sort((a,b)=>dir==="desc" ? b.vals[k]-a.vals[k] : a.vals[k]-b.vals[k]);
  }else arr.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  const tb=document.getElementById("rows");
  tb.innerHTML="";
  for(const m of arr){
    const tr=document.createElement("tr");
    let html=`<td class="name"><span class="name-text" title="${esc(m.name)}">${esc(m.name)}</span>
      <div class="name-actions"><button onclick="renameMember('${m.id}')">名前変更</button><button class="remove" onclick="removeMember('${m.id}')">除外</button></div></td>`;
    for(const k of activities) html+=cell(m,k,false);
    html+=cell(m,"参加",true);
    tr.innerHTML=html; tb.appendChild(tr);
  }
  document.getElementById("todayCount").textContent=state.members.filter(todayActive).length;
}
function cell(m,k,isPart){
  const v=m.vals[k];
  return `<td class="${isPart?'part':'metric'} ${shade(v)}">
    <div class="ctrl">
      <button onclick="change('${m.id}','${k}',-1)">−</button><span class="num">${v}</span><button onclick="change('${m.id}','${k}',1)">＋</button>
    </div></td>`;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

window.change=function(id,k,delta){
  const m=state.members.find(x=>x.id===id); if(!m)return;
  const old=m.vals[k];
  const next=Math.max(0,old+delta);
  const actual=next-old; if(!actual)return;

  m.vals[k]=next;

  if(activities.includes(k)){
    const p=periodKey();
    if(m.daily.period!==p){
      m.daily={period:p,delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
      m.baseToday=m.vals.参加;
    }
    if(!m.daily.acts)m.daily.acts={募集:0,リーグ:0,トロ:0,腕スタ:0};

    // 当日の活動数を管理。活動が1件でもあれば参加は1人1回だけ。
    m.daily.acts[k]=Math.max(0,(m.daily.acts[k]||0)+actual);
    const hasTodayActivity=activities.some(a=>(m.daily.acts[a]||0)>0);

    if(actual>0 && !m.daily.delta && hasTodayActivity){
      m.vals.参加=Math.max(0,(+m.vals.参加||0)+1);
      m.daily.delta=1;
      ensureDailyPeriod();
      state.todayParticipants=(+state.todayParticipants||0)+1;
    }else if(actual<0 && m.daily.delta && !hasTodayActivity){
      m.vals.参加=Math.max(0,(+m.vals.参加||0)-1);
      m.daily.delta=0;
    }

    if(actual>0){
      state.logs.unshift({
        name:m.name,item:k,time:new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})
      });
    }else if(actual<0){
      // 減らしたら、その「最後の＋」に対応する増加記録を1件だけ削除
      const idx=state.logs.findIndex(x=>x.name===m.name && x.item===k);
      if(idx>=0)state.logs.splice(idx,1);
    }
    state.logs=state.logs.slice(0,5);
  }else if(k==="参加"){
    const p=periodKey();
    if(m.daily.period!==p){
      m.daily={period:p,delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
      m.baseToday=m.vals.参加;
    }
    m.vals.参加=Math.max(0,(+m.vals.参加||0)+actual);
    ensureDailyPeriod();
    if(actual!==0){
      state.todayParticipants=Math.max(0,(+state.todayParticipants||0)+actual);
    }

    // 参加を手動で0に戻した場合は、その日の自動参加フラグも解除。
    // 以後、募集/リーグ/トロ/腕スタを+すると再び参加+1できる。
    if(m.vals.参加===0) m.daily.delta=0;
  }
  save();render();
};

window.renameMember=function(id){
  const m=state.members.find(x=>x.id===id);if(!m)return;
  const n=prompt("新しいメンバー名",m.name);
  if(n!==null && n.trim()){
  const oldName=m.name;
  m.name=n.trim();
  state.logs.forEach(x=>{if(x.name===oldName)x.name=m.name;});
  save();render();
}
};
window.removeMember=function(id){
  const m=state.members.find(x=>x.id===id);if(!m)return;
  if(confirm(`${m.name} を除外しますか？\n増加記録からもこのメンバーの記録を削除します。`)){
  state.members=state.members.filter(x=>x.id!==id);
  state.logs=state.logs.filter(x=>x.name!==m.name);
  save();render();
}
};

document.getElementById("addBtn").onclick=()=>{
  document.getElementById("addBox").style.display="flex";
  document.getElementById("newName").focus();
};
document.getElementById("cancelAdd").onclick=()=>document.getElementById("addBox").style.display="none";
document.getElementById("doAdd").onclick=()=>{
  const n=document.getElementById("newName").value.trim();
  if(!n)return;
  state.members.push(blankMember(n));
  document.getElementById("newName").value="";
  document.getElementById("addBox").style.display="none";
  save();render();
};
document.getElementById("newName").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("doAdd").click()});
document.getElementById("sort").onchange=render;

document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("全員の活動・参加累計を0にします。今日の参加人数も0になります。よろしいですか？"))return;
  for(const m of state.members){m.vals={募集:0,リーグ:0,トロ:0,腕スタ:0,参加:0};m.daily={period:periodKey(),delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};m.baseToday=0;}
  save();render();
};
document.getElementById("darkBtn").onclick=()=>{
  state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);save();
};

document.getElementById("logBtn").onclick=()=>{
  const list=document.getElementById("logList");
  if(!state.logs.length){
    list.innerHTML='<div class="log-empty">まだ増加記録はありません。</div>';
  }else{
    list.innerHTML=state.logs.slice(0,5).map(x=>`<div class="log-item"><div class="log-name">${esc(x.name)}</div><div class="log-meta">${esc(x.item)}　・　${esc(x.time)}</div></div>`).join("");
  }
  document.getElementById("logModal").style.display="flex";
};
document.getElementById("logClose").onclick=()=>document.getElementById("logModal").style.display="none";
document.getElementById("logModal").onclick=(e)=>{if(e.target.id==="logModal")e.currentTarget.style.display="none"};

document.body.classList.toggle("dark",!!state.dark);
normalize();render();
setInterval(()=>{normalize();render()},30000);
</script>
</body>
</html>
