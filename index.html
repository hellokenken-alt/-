<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🐾🐱 狸と猫・活動集計</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#667085;
  --line:#d9dee7;--head:#151a20;--blue:#087fe5;--red:#e53935;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
body.dark{--bg:#101419;--card:#171c22;--text:#f4f7fb;--muted:#aab3bf;--line:#303944;--head:#0b0f13}
.wrap{max-width:980px;margin:auto;padding:7px 5px 70px}
.title-row{display:flex;align-items:baseline;gap:7px;flex-wrap:nowrap}
h1{font-size:20px;margin:0;white-space:nowrap}
.period-label{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:9px;color:var(--muted);margin:2px 0 5px}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
button,select,input{font:inherit}
button,select,input[type=text],input[type=date]{
border:1px solid #d4dae3;border-radius:12px;background:var(--card);color:var(--text)}
button{padding:6px 8px;cursor:pointer;font-size:10px}
.primary{color:var(--blue);font-weight:700}.danger{color:var(--red)}
#sort{padding:6px 22px 6px 7px;font-size:10px}
#addBox{display:none;gap:6px;width:100%;margin:0 0 7px}
#addBox input{flex:1;padding:9px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin-bottom:5px;font-size:11px}
.today-controls{display:inline-flex;align-items:center;gap:5px}
.today-controls button{width:25px;height:23px;padding:0;border:0;border-radius:7px;background:#edf0f3;color:var(--blue);font-size:17px;line-height:1}
body.dark .today-controls button{background:#202832}
.today-controls span{min-width:16px;text-align:center;font-size:13px}
.today-reset{margin-left:7px;font-size:9px;padding:4px 6px}
.table-wrap{;border:1px solid var(--line);background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:0;table-layout:fixed}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
th{background:var(--head);color:#fff;height:32px;font-size:11px}
th.name,td.name{width:35%}th.metric,td.metric{width:13%}th.part,td.part{width:13%}
td{height:34px;background:var(--card)}
td.name{padding:2px 3px;font-weight:700;vertical-align:middle}
.name-text{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.name-actions{display:flex;gap:2px;margin-top:1px}
.name-actions button{font-size:7px;padding:1px 3px;border:0;border-radius:5px;color:var(--blue);background:#edf5ff}
.name-actions .remove{color:var(--red);background:#fff0f0}
body.dark .name-actions button{background:#202a35}
.count-colored{background:var(--count-bg)!important}
body.dark .count-colored{background:var(--count-dark-bg)!important}
.ctrl{display:flex;align-items:center;justify-content:center;gap:1px}
.ctrl button{width:21px;height:22px;padding:0;border:0;border-radius:6px;background:#eef2f6;color:var(--blue);font-size:16px;line-height:1}
body.dark .ctrl button{background:#202832}
.num{font-size:11px;min-width:10px;text-align:center}
.v5{background:#f7fbff!important}.v10{background:#f0f8ff!important}.v15{background:#e9f5ff!important}
.v20{background:#e1f1ff!important}.v25{background:#d8edff!important}.v30{background:#cfe9ff!important}
body.dark .v5,body.dark .v10,body.dark .v15,body.dark .v20,body.dark .v25,body.dark .v30{background:#1b2b3a!important}
.modal{inset:0;background:rgba(0,0,0,.48);display:none;align-items:flex-end;justify-content:center;z-index:99}
.panel{width:min(560px,94vw);max-height:78vh;overflow:auto;background:var(--card);color:var(--text);border-radius:18px 18px 0 0;padding:14px 14px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.modal-title{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px}
.close{border:0;background:#edf0f3;color:#333;border-radius:10px;padding:6px 10px;font-size:12px}
body.dark .close{background:#252c34;color:#fff}
.log-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:6px 0;background:var(--card)}
.log-name{font-weight:800;font-size:14px}.log-meta{font-size:12px;color:var(--muted);margin-top:3px}
.log-delete{font-size:10px;color:var(--red);padding:5px 8px}
.log-empty{text-align:center;color:var(--muted);padding:20px 5px}
.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.manage-grid button{font-size:11px;padding:10px 7px}
.date-box{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.date-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.date-row label{font-size:11px;color:var(--muted)}
.date-row input{padding:7px;font-size:11px}
.date-actions{display:flex;gap:6px;margin-top:9px}
.date-actions button{font-size:10px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat-card{border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.stat-label{font-size:10px;color:var(--muted)}.stat-value{font-size:18px;font-weight:800;margin-top:2px}
.stats-subtitle{font-weight:800;margin:14px 0 5px}
.rank-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 2px;font-size:12px}
@media(max-width:700px){
 .wrap{padding:6px 4px 70px}.title-row{gap:5px}.period-label{font-size:8px}
 h1{font-size:18px}.note{font-size:8px}.toolbar{gap:3px}
 .toolbar button{font-size:9px;padding:5px 6px}.summary{font-size:10px}
 th{font-size:10px}.name-text{font-size:9px}.ctrl button{width:19px;height:21px;font-size:16px}
}

/* 見出しは表本体と完全に一緒にスクロール */
thead th{position:sticky!important;top:0!important;z-index:10!important}
thead{position:static!important}

/* メンバー名：大きめ＋右側に名前変更/除外を縦配置 */
td.name{position:relative;padding:3px 58px 3px 4px!important}
td.name .name-text{font-size:13px!important;line-height:1.25;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.name .name-actions{position:absolute;right:3px;top:3px;display:flex;flex-direction:column;gap:2px;margin:0}
td.name .name-actions button{font-size:7px!important;padding:2px 4px!important;line-height:1.1}
@media(max-width:700px){
  td.name .name-text{font-size:12px!important}
  td.name{padding-right:55px!important}
}
#manageModal{z-index:9999!important}\n</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1>🐾 🐱 狸と猫・活動集計</h1>
    <span class="period-label" id="periodLabel">集計日：未設定</span>
  </div>
  <div class="note">＋/−で増減。参加は1人につき1日1回。4:00〜翌3:59の間に活動すると参加が+1され、同じ日は増えません。個人の参加累計はリセットされません。</div>

  <div class="toolbar">
    <select id="sort">
      <option value="name">名前順</option>
      <option value="募集-desc">募集 多い順</option><option value="募集-asc">募集 少ない順</option>
      <option value="リーグ-desc">リーグ 多い順</option><option value="リーグ-asc">リーグ 少ない順</option>
      <option value="トロ-desc">トロ 多い順</option><option value="トロ-asc">トロ 少ない順</option>
      <option value="腕スタ-desc">腕スタ 多い順</option><option value="腕スタ-asc">腕スタ 少ない順</option>
      <option value="参加-desc">参加 多い順</option><option value="参加-asc">参加 少ない順</option>
    </select>
    <button class="primary" id="addBtn">＋メンバー追加</button>
    <button type="button" class="primary" id="manageBtn">⚙️ 管理</button>
  </div>

  <div id="addBox">
    <input id="newName" type="text" placeholder="メンバー名を入力">
    <button class="primary" id="doAdd">追加</button>
    <button id="cancelAdd">キャンセル</button>
  </div>

  <div class="summary">
    <b>今日の参加人数：</b>
    <span class="today-controls">
      <button onclick="changeTodayCount(-1)">−</button><span id="todayCount">0</span>人<button onclick="changeTodayCount(1)">＋</button>
    </span>
    <span style="color:var(--muted)">　（4:00〜翌3:59）</span>
    <button class="today-reset" onclick="resetTodayAdjustment()">調整を0に戻す</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="name">名前</th><th class="metric">募集</th><th class="metric">リーグ</th><th class="metric">トロ</th><th class="metric">腕スタ</th><th class="part">参加</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="modal" id="manageModal">
  <div class="panel">
    <div class="modal-title"><span>⚙️ 管理</span><button class="close" id="manageClose">閉じる</button></div>

    <div class="date-box">
      <div style="font-weight:800;font-size:13px;margin-bottom:7px">📅 集計日の設定</div>
      <div class="date-row">
        <label>開始</label><input id="startDate" type="date">
        <span>〜</span>
        <label>終了</label><input id="endDate" type="date">
      </div>
      <div class="date-actions">
        <button class="primary" id="saveDate">集計日を保存</button>
        <button id="clearDate">未設定に戻す</button>
      </div>
    </div>

    <div class="manage-grid">
      <button id="darkBtn">☀️ / 🌙 ダークモード</button>
      <button id="logBtn">📋 増加記録</button>
      <button id="statsBtn">📊 統計</button>
      <button id="backupBtn">📥 バックアップ</button>
      <button id="restoreBtn">📤 復元</button>
      <button class="danger" id="resetBtn">🗑️ 全リセット</button>
    </div>
    <input id="restoreFile" type="file" accept=".json" style="display:none">
  </div>
</div>

<div class="modal" id="logModal">
  <div class="panel">
    <div class="modal-title"><span>📋 増加記録・最新5件</span><button class="close" id="logClose">閉じる</button></div>
    <div id="logList"></div>
  </div>
</div>

<div class="modal" id="statsModal">
  <div class="panel">
    <div class="modal-title"><span>📊 統計</span><button class="close" id="statsClose">閉じる</button></div>
    <div id="statsContent"></div>
  </div>
</div>

<script>
const KEY="tanuki_neko_activity_v7";
const membersDefault=["aba","DODダディ","DR7","LATTE","NAO","Nob55","Pスケ","Ronho","ruru","あも","かつ","キィ〜","けんけん","こき見賢","コレルア","しのあ","しゅー①","ちろさん","ないん","にょきち","ねこ","のび太","ピース","ピョニー","ボーちゃん","みい","ミケユリX","みたま","むらびと","メンチカツ","よいでないか","レクイエム","薫","釈迦釈迦チキン","松居","神様","茶々丸","猫","博奕うんべぇ","夜ト"];
const activities=["募集","リーグ","トロ","腕スタ"];

function periodKey(){
 const d=new Date(); if(d.getHours()<4)d.setDate(d.getDate()-1);
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function blankMember(name){
 return {id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random()),name,
 vals:{募集:0,リーグ:0,トロ:0,腕スタ:0,参加:0},
 daily:{period:periodKey(),delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}},baseToday:0};
}
function load(){
 try{
  const s=localStorage.getItem(KEY);
  if(s)return JSON.parse(s);
 }catch(e){}
 return {members:membersDefault.map(blankMember),logs:[],dark:false,todayManualDelta:0,todayPeriod:periodKey(),startDate:"",endDate:""};
}
let state=load();

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ensureDailyPeriod(){
 const p=periodKey();
 if(state.todayPeriod!==p){state.todayPeriod=p;state.todayManualDelta=0}
 if(typeof state.todayManualDelta!=="number")state.todayManualDelta=0;
 for(const m of state.members){
  if(!m.daily||m.daily.period!==p){
   m.daily={period:p,delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
   m.baseToday=m.vals.参加||0;
  }
  if(!m.daily.acts)m.daily.acts={募集:0,リーグ:0,トロ:0,腕スタ:0};
 }
}
function normalize(){
 if(!Array.isArray(state.members))state.members=[];
 if(!Array.isArray(state.logs))state.logs=[];
 ensureDailyPeriod();
 if(typeof state.dark!=="boolean")state.dark=false;
 if(typeof state.startDate!=="string")state.startDate="";
 if(typeof state.endDate!=="string")state.endDate="";
 save();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shade(v){
  if(v<5)return "";
  return "count-colored";
}
function countBg(v){
  if(v<5)return "";
  const step=Math.floor(v/5);
  // 各項目の背景色：5ごとに「青→水色→緑→黄→橙→赤→ピンク→紫」へ変化
  const palette=[
    "#d9efff", // 5-9   青
    "#d7f5ff", // 10-14 水色
    "#ddf5d8", // 15-19 緑
    "#fff5b8", // 20-24 黄
    "#ffe0b2", // 25-29 オレンジ
    "#ffd0cc", // 30-34 赤
    "#ffd2e6", // 35-39 ピンク
    "#ead4ff"  // 40-44 紫
  ];
  return palette[(step-1)%palette.length];
}
function countDarkBg(v){
  if(v<5)return "";
  const step=Math.floor(v/5);
  const palette=[
    "#315d86", // 青
    "#2f7182", // 水色
    "#3f7540", // 緑
    "#7d7027", // 黄
    "#8a5428", // オレンジ
    "#843f3a", // 赤
    "#7d3f60", // ピンク
    "#62458a"  // 紫
  ];
  return palette[(step-1)%palette.length];
}
function todayActive(m){return (m.daily?.delta||0)>0}
function autoTodayCount(){return state.members.filter(todayActive).length}
function displayedTodayCount(){return Math.max(0,autoTodayCount()+(Number(state.todayManualDelta)||0))}
function changeTodayCount(delta){
 ensureDailyPeriod();state.todayManualDelta=(Number(state.todayManualDelta)||0)+delta;save();render();
}
function resetTodayAdjustment(){state.todayManualDelta=0;save();render()}

function formatDateJP(s){
 if(!s)return "";
 const [y,m,d]=s.split("-");
 return `${Number(y)}年${Number(m)}月${Number(d)}日`;
}
function renderPeriod(){
 const el=document.getElementById("periodLabel");
 if(state.startDate&&state.endDate)el.textContent=`集計日：${formatDateJP(state.startDate)}〜${formatDateJP(state.endDate)}`;
 else if(state.startDate)el.textContent=`集計日：${formatDateJP(state.startDate)}〜`;
 else if(state.endDate)el.textContent=`集計日：〜${formatDateJP(state.endDate)}`;
 else el.textContent="集計日：未設定";
}
function openModal(id){document.getElementById(id).style.display="flex"}
function closeModal(id){document.getElementById(id).style.display="none"}

function render(){
 normalize();renderPeriod();
 let arr=[...state.members],s=document.getElementById("sort").value;
 if(s!=="name"){
  const [k,dir]=s.split("-");
  arr.sort((a,b)=>dir==="desc"?(b.vals[k]||0)-(a.vals[k]||0):(a.vals[k]||0)-(b.vals[k]||0));
 }else arr.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
 const tb=document.getElementById("rows");tb.innerHTML="";
 for(const m of arr){
  const tr=document.createElement("tr");
  let h=`<td class="name"><span class="name-text" title="${esc(m.name)}">${esc(m.name)}</span>
  <div class="name-actions"><button onclick="renameMember('${m.id}')">名前変更</button><button class="remove" onclick="removeMember('${m.id}')">除外</button></div></td>`;
  for(const k of activities)h+=cell(m,k,false);
  h+=cell(m,"参加",true);tr.innerHTML=h;tb.appendChild(tr);
 }
 document.getElementById("todayCount").textContent=displayedTodayCount();
}
function cell(m,k,isPart){
 const v=Number(m.vals[k]||0);
 const bg=countBg(v), dbg=countDarkBg(v);
 const style=bg?`style="--count-bg:${bg};--count-dark-bg:${dbg}"`:"";
 return `<td class="${isPart?'part':'metric'} ${shade(v)}" ${style}><div class="ctrl">
 <button onclick="change('${m.id}','${k}',-1)">−</button><span class="num">${v}</span><button onclick="change('${m.id}','${k}',1)">＋</button></div></td>`;
}

window.change=function(id,k,delta){
 const m=state.members.find(x=>x.id===id);if(!m)return;
 const old=Number(m.vals[k]||0),next=Math.max(0,old+delta),actual=next-old;if(!actual)return;
 m.vals[k]=next;
 if(activities.includes(k)){
  const p=periodKey();
  if(m.daily.period!==p)m.daily={period:p,delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
  if(!m.daily.acts)m.daily.acts={募集:0,リーグ:0,トロ:0,腕スタ:0};
  m.daily.acts[k]=Math.max(0,(m.daily.acts[k]||0)+actual);
  const hasToday=activities.some(a=>(m.daily.acts[a]||0)>0);
  if(actual>0&&!m.daily.delta&&hasToday){
   m.vals.参加=Math.max(0,Number(m.vals.参加||0)+1);m.daily.delta=1;state.todayManualDelta=Number(state.todayManualDelta)||0;
  }else if(actual<0&&m.daily.delta&&!hasToday){
   m.vals.参加=Math.max(0,Number(m.vals.参加||0)-1);m.daily.delta=0;
  }
  if(actual>0)state.logs.unshift({id:(crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random()),name:m.name,item:k,time:new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"})});
  else{
   const idx=state.logs.findIndex(x=>x.name===m.name&&x.item===k);
   if(idx>=0)state.logs.splice(idx,1);
  }
  state.logs=state.logs.slice(0,5);
 }else if(k==="参加"){
  m.vals.参加=Math.max(0,Number(m.vals.参加||0)+actual);
  if(m.vals.参加===0)m.daily.delta=0;
  state.todayManualDelta=Number(state.todayManualDelta)||0;
 }
 save();render();
};

window.deleteLog=function(index){
 const x=state.logs[index];if(!x)return;
 const m=state.members.find(v=>v.name===x.name);
 if(!m){state.logs.splice(index,1);save();renderLogs();return}
 if(!confirm(`${x.name} の「${x.item}」の増加記録を削除しますか？\n表の${x.item}も1減らします。`))return;
 if((m.vals[x.item]||0)<=0){state.logs.splice(index,1);save();renderLogs();return}
 m.vals[x.item]=Math.max(0,m.vals[x.item]-1);
 if(m.daily&&m.daily.acts&&m.daily.period===periodKey()){
  m.daily.acts[x.item]=Math.max(0,(m.daily.acts[x.item]||0)-1);
  const hasToday=activities.some(a=>(m.daily.acts[a]||0)>0);
  if(!hasToday&&m.daily.delta){m.daily.delta=0;m.vals.参加=Math.max(0,(m.vals.参加||0)-1)}
 }
 state.logs.splice(index,1);save();render();renderLogs();
};

function renderLogs(){
 const list=document.getElementById("logList");
 if(!state.logs.length){list.innerHTML='<div class="log-empty">まだ増加記録はありません。</div>';return}
 list.innerHTML=state.logs.slice(0,5).map((x,i)=>`<div class="log-item">
 <div><div class="log-name">${esc(x.name)}</div><div class="log-meta">${esc(x.item)}　・　${esc(x.time)}</div></div>
 <button class="log-delete" onclick="deleteLog(${i})">削除</button></div>`).join("");
}
window.renameMember=function(id){
 const m=state.members.find(x=>x.id===id);if(!m)return;
 const n=prompt("新しいメンバー名",m.name);
 if(n!==null&&n.trim()){const old=m.name;m.name=n.trim();state.logs.forEach(x=>{if(x.name===old)x.name=m.name});save();render()}
};
window.removeMember=function(id){
 const m=state.members.find(x=>x.id===id);if(!m)return;
 if(confirm(`${m.name} を除外しますか？\n増加記録からもこのメンバーの記録を削除します。`)){
  state.members=state.members.filter(x=>x.id!==id);state.logs=state.logs.filter(x=>x.name!==m.name);save();render();
 }
};

function calcStats(){
 const total=state.members.length;
 const sums={募集:0,リーグ:0,トロ:0,腕スタ:0,参加:0};
 state.members.forEach(m=>Object.keys(sums).forEach(k=>sums[k]+=Number(m.vals[k]||0)));
 const ranks=[...state.members].sort((a,b)=>(b.vals.参加||0)-(a.vals.参加||0)).slice(0,5);
 return {total,sums,ranks};
}
function renderStats(){
 const x=calcStats(),avg=x.total?Math.round(x.sums.参加/x.total*10)/10:0;
 document.getElementById("statsContent").innerHTML=`
 <div class="stats-grid">
  <div class="stat-card"><div class="stat-label">メンバー数</div><div class="stat-value">${x.total}人</div></div>
  <div class="stat-card"><div class="stat-label">今日の参加人数</div><div class="stat-value">${displayedTodayCount()}人</div></div>
  <div class="stat-card"><div class="stat-label">参加累計</div><div class="stat-value">${x.sums.参加}</div></div>
  <div class="stat-card"><div class="stat-label">1人あたり参加平均</div><div class="stat-value">${avg}</div></div>
  <div class="stat-card"><div class="stat-label">募集</div><div class="stat-value">${x.sums.募集}</div></div>
  <div class="stat-card"><div class="stat-label">リーグ</div><div class="stat-value">${x.sums.リーグ}</div></div>
  <div class="stat-card"><div class="stat-label">トロ</div><div class="stat-value">${x.sums.トロ}</div></div>
  <div class="stat-card"><div class="stat-label">腕スタ</div><div class="stat-value">${x.sums.腕スタ}</div></div>
 </div>
 <div class="stats-subtitle">🏆 参加累計TOP5</div>
 ${x.ranks.length?x.ranks.map((m,i)=>`<div class="rank-row"><span>${i+1}. ${esc(m.name)}</span><b>${m.vals.参加||0}</b></div>`).join(""):'<div class="log-empty">メンバーがいません。</div>'}`;
}

document.getElementById("manageBtn").onclick=()=>{
 document.getElementById("startDate").value=state.startDate||"";
 document.getElementById("endDate").value=state.endDate||"";
 openModal("manageModal");
};
document.getElementById("sort").onchange=render;
document.getElementById("manageBtn").onclick=()=>{
 document.getElementById("startDate").value=state.startDate||"";
 document.getElementById("endDate").value=state.endDate||"";
 openModal("manageModal");
};
document.getElementById("manageClose").onclick=()=>closeModal("manageModal");
document.getElementById("manageModal").onclick=e=>{if(e.target.id==="manageModal")closeModal("manageModal")};

document.getElementById("saveDate").onclick=()=>{
 const s=document.getElementById("startDate").value,e=document.getElementById("endDate").value;
 if(s&&e&&s>e){alert("開始日は終了日以前にしてください。");return}
 state.startDate=s;state.endDate=e;save();render();closeModal("manageModal");
};
document.getElementById("clearDate").onclick=()=>{
 state.startDate="";state.endDate="";save();render();
 document.getElementById("startDate").value="";document.getElementById("endDate").value="";
};

document.getElementById("darkBtn").onclick=()=>{
 state.dark=!state.dark;document.body.classList.toggle("dark",state.dark);save();
};
document.getElementById("logBtn").onclick=()=>{renderLogs();closeModal("manageModal");openModal("logModal")};
document.getElementById("logClose").onclick=()=>closeModal("logModal");
document.getElementById("logModal").onclick=e=>{if(e.target.id==="logModal")closeModal("logModal")};

document.getElementById("backupBtn").onclick=()=>{
 const data={version:2,exportedAt:new Date().toISOString(),state};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=`tanuki_neko_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=e=>{
 const file=e.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result),incoming=data.state||data;
   if(!incoming||!Array.isArray(incoming.members))throw new Error();
   if(!confirm("現在の集計データをバックアップの内容で置き換えますか？"))return;
   state=incoming;normalize();save();render();alert("データを復元しました。");
  }catch(err){alert("バックアップファイルを読み込めませんでした。")}
  e.target.value="";
 };
 reader.readAsText(file);
};

document.getElementById("addBtn").onclick=()=>{
 document.getElementById("addBox").style.display="flex";document.getElementById("newName").focus();
};
document.getElementById("cancelAdd").onclick=()=>document.getElementById("addBox").style.display="none";
document.getElementById("doAdd").onclick=()=>{
 const n=document.getElementById("newName").value.trim();if(!n)return;
 state.members.push(blankMember(n));document.getElementById("newName").value="";
 document.getElementById("addBox").style.display="none";save();render();
};
document.getElementById("newName").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("doAdd").click()});
document.getElementById("resetBtn").onclick=()=>{
 if(!confirm("全員の活動・参加累計、増加記録、今日の参加人数を0にします。よろしいですか？"))return;
 for(const m of state.members){
  m.vals={募集:0,リーグ:0,トロ:0,腕スタ:0,参加:0};
  m.daily={period:periodKey(),delta:0,acts:{募集:0,リーグ:0,トロ:0,腕スタ:0}};
  m.baseToday=0;
 }
 state.logs=[];state.todayManualDelta=0;state.todayPeriod=periodKey();save();render();closeModal("manageModal");
};

document.body.classList.toggle("dark",!!state.dark);
normalize();render();
setInterval(()=>{normalize();render()},30000);
</script>
